<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Semanal - GymFit</title>

    <!-- Hoja de estilos global del proyecto -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* Fondo y tipografía */
        body.bg {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)),
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=90') center/cover no-repeat fixed;
            min-height: 100vh;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }

        /* Botón volver */
        .agrandarVolver a {
            position: fixed;
            top: 25px;
            left: 25px;
            background: linear-gradient(135deg, #ff6b00, #ff8f00);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(255,107,0,0.4);
            transition: all 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .agrandarVolver a:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,107,0,0.6);
            background: linear-gradient(135deg, #ff8f00, #ffb300);
        }

        /* Título Principal */
        h1 {
            text-align: center;
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ff6b00, #ff8f00, #ffb300, #ff6b00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,107,0,0.5);
            margin: 80px 0 60px;
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px #ff6b00); }
            to { filter: drop-shadow(0 0 40px #ffb300); }
        }

        /* Cabecera de cada día */
        .dia-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #00eeff;
            padding: 20px 40px;
            margin: 50px auto 30px;
            max-width: 600px;
            border-radius: 25px;
            text-align: center;
            font-size: 2.6rem;
            font-weight: 900;
            border: 3px solid #00eeff;
            box-shadow: 0 0 40px rgba(0, 238, 255, 0.4), inset 0 0 20px rgba(0, 238, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Tarjetas de rutina */
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }

        .rutina-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            width: 320px;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: all 0.4s ease;
        }

        .rutina-card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 25px 60px rgba(255,107,0,0.5);
            border-color: #ff6b00;
        }

        .rutina-card h3 {
            color: #ff6b00;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255,107,0,0.6);
        }

        .notes {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #e0e0e0;
            font-weight: 600;
        }

        /* Días de descanso */
        .descanso {
            background: linear-gradient(145deg, #0f3460, #1a1a2e);
            border: 3px solid #00d4ff;
        }

        .descanso:hover {
            box-shadow: 0 25px 60px rgba(0,212,255,0.5);
            border-color: #00eeff;
        }

        .descanso h3 {
            color: #00eeff;
            text-shadow: 0 0 20px rgba(0,238,255,0.6);
        }

        /* Responsividad */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; margin-top: 100px; }
            .dia-header { font-size: 2rem; padding: 15px; margin-left: 20px; margin-right: 20px; }
            .rutina-card { width: 100%; margin: 0; }
        }
    </style>
</head>
<body class="bg">

<div class="agrandarVolver">
    <!-- Botón que lleva a la raíz, asegúrate de que tu compañero tenga algo en "/" -->
    <a href="/">Volver al Inicio</a>
</div>

<h1>RUTINA SEMANAL</h1>

<!-- Iteramos sobre el mapa que envía el controlador -->
<div th:each="entry : ${routinesByDay}">

    <!-- Cabecera del Día (Ej: Día 1) -->
    <div class="dia-header" th:text="${entry.key}"></div>

    <div class="cards">
        <!-- Iteramos sobre las rutinas de ese día específico -->
        <div th:each="r : ${entry.value}"
             th:class="${r.title.contains('Descanso')} ? 'rutina-card descanso' : 'rutina-card'">

            <!-- Título de la rutina -->
            <h3 th:text="${r.title}"></h3>

            <!-- Notas con saltos de línea procesados por Thymeleaf -->
            <div class="notes" th:utext="${r.notes.replace('\n', '<br>')}"></div>

        </div>
    </div>
</div>

</body>
</html>
