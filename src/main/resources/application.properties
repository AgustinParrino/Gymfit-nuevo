spring.application.name=GymFit
server.port=${SERVER_PORT:8081}

# Funciona inmediatamente sin instalar MySQL. Los datos quedan en ./data/gymfit.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gymfit;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Consola local para revisar la base H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
