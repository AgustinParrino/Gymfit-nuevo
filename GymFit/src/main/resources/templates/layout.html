<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · GymFit'">GymFit</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="icon" th:href="@{/favicon.svg}">
    <script defer th:src="@{/app.js}"></script>
</head>
<body>

<!-- BARRA LATERAL (SIDEBAR) -->
<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/}">
        <span class="brand-icon">▥</span> Gym<span>Fit</span>
    </a>

    <p class="nav-label">ENTRENAMIENTO</p>
    <nav>
        <a th:href="@{/}" th:classappend="${page == 'dashboard'} ? 'active'">
            <span>◫</span> Panel general
        </a>
        <a th:href="@{/routines}" th:classappend="${page == 'routines'} ? 'active'">
            <span>≡</span> Rutinas
        </a>
        <a th:href="@{/exercises}" th:classappend="${page == 'exercises'} ? 'active'">
            <span>◇</span> Ejercicios
        </a>
        <a th:href="@{/diets}" th:classappend="${page == 'diets'} ? 'active'">
            <span>🍽</span> Dietas
        </a>
        <a th:href="@{/history}" th:classappend="${page == 'history'} ? 'active'">
            <span>◷</span> Historial
        </a>
    </nav>

    <div class="sidebar-bottom">
        <span class="avatar">A</span>
        <div>
            <strong>Administrador</strong>
            <small>GymFit</small>
        </div>
        <form th:action="@{/logout}" method="post">
            <button class="icon-button" aria-label="Cerrar sesión" title="Cerrar sesión">⏻</button>
        </form>
    </div>
</aside>

<!-- BARRA SUPERIOR (TOPBAR) -->
<header th:fragment="topbar(title)" class="topbar">
    <div>
        <p class="eyebrow">TU ESPACIO DE ENTRENAMIENTO</p>
        <h1 th:text="${title}"></h1>
    </div>
    <div class="topbar-account">
        <span class="admin-badge">Administrador</span>
        <form th:action="@{/logout}" method="post">
            <button class="icon-button" aria-label="Cerrar sesión" title="Cerrar sesión">⏻</button>
        </form>
    </div>
</header>

<!-- ALERTAS DEL SISTEMA -->
<div th:fragment="alerts">
    <p role="status" class="alert" th:if="${success}" th:text="${success}"></p>
    <p role="alert" class="alert error" th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>
