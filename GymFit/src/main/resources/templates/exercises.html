<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Ejercicios')}"></head><body><aside th:replace="~{layout :: sidebar}"></aside><main><header th:replace="~{layout :: topbar('Ejercicios')}"></header><div th:replace="~{layout :: alerts}"></div><div class="section-heading"><p class="muted">Tu biblioteca de movimientos</p><a class="button" th:href="@{/exercises/new}">+ Agregar ejercicio</a></div><form class="filters" th:action="@{/exercises}" method="get"><label class="search">Buscar ejercicio<input name="q" placeholder="Nombre del ejercicio…" th:value="${q}"></label><label>Grupo muscular<select name="muscle"><option value="">Todos los grupos<option th:each="g : ${muscles}" th:value="${g}" th:text="${g}" th:selected="${g == muscle}"></option></select></label><button class="button secondary">Buscar</button><a th:href="@{/exercises}">Limpiar</a></form><section class="card-grid"><article class="exercise-card" th:each="e : ${exercises}"><div class="section-heading"><span class="tile-icon">◇</span><span class="pill" th:text="${e.difficulty}"></span></div><p class="eyebrow" th:text="${e.muscle}"></p><h2 th:text="${e.name}"></h2><small th:text="${e.equipment}"></small><p th:text="${e.description}"></p><div class="card-actions"><a class="button secondary" th:href="@{/exercises/{id}/edit(id=${e.id})}">Editar</a><form th:action="@{/exercises/{id}/delete(id=${e.id})}" method="post" data-confirm="¿Eliminar este ejercicio?"><button class="text-button danger">Eliminar</button></form></div></article></section><section class="panel empty" th:if="${exercises.empty}"><h2>No hay ejercicios que coincidan</h2><p>Probá otra búsqueda o agregá un ejercicio.</p></section></main></body></html>
