<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Historial')}"></head><body><aside th:replace="~{layout :: sidebar}"></aside><main><header th:replace="~{layout :: topbar('Historial')}"></header><div th:replace="~{layout :: alerts}"></div><section class="panel"><div class="section-heading"><h2>Entrenamientos completados</h2><a class="button secondary" th:href="@{/routines}">Elegir una rutina</a></div><div class="table-scroll" th:if="${!logs.empty}"><table><thead><tr><th>Fecha</th><th>Rutina</th><th>Duración</th><th>Notas</th><th></th></tr></thead><tbody><tr th:each="l : ${logs}"><td th:text="${#temporals.format(l.date,'dd/MM/yyyy')}"></td><td th:text="${l.routineName}"></td><td th:text="${l.minutes} + ' min'"></td><td th:text="${l.notes}"></td><td><form th:action="@{/history/{id}/delete(id=${l.id})}" method="post" data-confirm="¿Eliminar este registro del historial?"><button class="text-button danger">Eliminar</button></form></td></tr></tbody></table></div><div class="empty" th:if="${logs.empty}"><span class="empty-symbol">◷</span><h2>Todavía no hay entrenamientos</h2><p>Desde el detalle de una rutina podés registrar tu primera sesión.</p></div></section></main></body></html>
