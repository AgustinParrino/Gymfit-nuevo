<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Guardar ejercicio')}"></head><body><aside th:replace="~{layout :: sidebar}"></aside><main><header th:replace="~{layout :: topbar('Guardar ejercicio')}"></header><div th:replace="~{layout :: alerts}"></div><a class="back" th:href="@{/exercises}">Volver al catálogo</a><form class="panel form-panel" th:action="@{/exercises/save}" method="post"><input type="hidden" name="id" th:value="${exercise.id}" th:if="${exercise.id != null}"><h2 th:text="${exercise.id == null ? 'Nuevo ejercicio' : 'Editar ejercicio'}"></h2><label>Nombre<input name="name" required maxlength="100" th:value="${exercise.name}" placeholder="Ej.: Remo con barra"></label><div class="form-grid"><label>Grupo muscular<select name="muscle"><option th:each="g : ${muscles}" th:text="${g}" th:value="${g}" th:selected="${g == exercise.muscle}"></option></select></label><label>Dificultad<select name="difficulty"><option th:each="g : ${levels}" th:text="${g}" th:value="${g}" th:selected="${g == exercise.difficulty}"></option></select></label></div><label>Equipamiento<input required name="equipment" maxlength="100" th:value="${exercise.equipment}" placeholder="Ej.: Barra y discos"></label><label>Indicaciones técnicas<textarea required name="description" maxlength="2000" rows="5" th:text="${exercise.description}"></textarea></label><div class="card-actions"><button class="button">Guardar ejercicio</button><a class="button secondary" th:href="@{/exercises}">Cancelar</a></div></form></main></body></html>
