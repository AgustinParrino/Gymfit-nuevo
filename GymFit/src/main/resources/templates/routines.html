<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Rutinas')}"></head><body><aside th:replace="~{layout :: sidebar}"></aside><main><header th:replace="~{layout :: topbar('Rutinas')}"></header><div th:replace="~{layout :: alerts}"></div><div class="section-heading"><p class="muted">Planes organizados por día y objetivo</p><a class="button" th:href="@{/routines/new}">+ Crear rutina</a></div><section class="card-grid"><article class="panel routine-card" th:each="r : ${routines}"><div class="section-heading"><span class="tile-icon">≡</span><span class="pill" th:text="${r.day}"></span></div><h2 th:text="${r.name}"></h2><p th:text="${r.goal}"></p><small th:text="${r.difficulty} + ' · ' + ${r.items.size()} + ' ejercicios'"></small><div class="exercise-preview"><span th:each="t : ${r.items}" th:text="${t.exercise.name}"></span></div><div class="card-actions"><a class="button" th:href="@{/routines/{id}(id=${r.id})}">Abrir rutina</a><a class="button secondary" th:href="@{/routines/{id}/edit(id=${r.id})}">Editar</a><form th:action="@{/routines/{id}/delete(id=${r.id})}" method="post" data-confirm="¿Eliminar esta rutina? Se conservará el historial."><button class="text-button danger">Eliminar</button></form></div></article></section><div class="panel empty" th:if="${routines.empty}"><h2>Tu primer plan empieza acá</h2><p>Creá una rutina y elegí los ejercicios del catálogo.</p></div></main></body></html>
