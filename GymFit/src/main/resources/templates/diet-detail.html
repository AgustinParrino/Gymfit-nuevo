<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${diet.name})}"></head>
<body class="app-layout">

<aside th:replace="~{layout :: sidebar}"></aside>

<div class="app-content">
    <header th:replace="~{layout :: topbar(${diet.name})}"></header>

    <main class="main-body">
        <div th:replace="~{layout :: alerts}"></div>

        <div class="toolbar">
            <a th:href="@{/diets}" class="button outline">← Volver a Dietas</a>
        </div>

        <section class="card" style="margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                <span class="badge" th:text="${diet.type}">Tipo</span>
                <span class="muted">Objetivo: <strong th:text="${diet.goal}">Objetivo</strong></span>
            </div>
            <p th:text="${diet.description}" style="font-size: 1.1rem; line-height: 1.5;"></p>
        </section>

        <h3 style="margin-bottom: 1rem;">Estructura del Menú Diario</h3>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div th:each="meal : ${mealsList}" class="card" style="border-left: 4px solid var(--accent, #70ff00);">
                <p th:text="${meal}" style="font-size: 1.05rem; margin: 0; font-weight: 500;"></p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
