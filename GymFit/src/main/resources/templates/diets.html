<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Dietas')}"></head>
<body class="app-layout">

<aside th:replace="~{layout :: sidebar}"></aside>

<div class="app-content">
    <header th:replace="~{layout :: topbar('Dietas')}"></header>

    <main class="main-body">
        <div th:replace="~{layout :: alerts}"></div>

        <div class="section-heading">
            <div>
                <p class="eyebrow">PLANES NUTRICIONALES</p>
                <p class="muted">Planes organizados por tipo y objetivo calórico</p>
            </div>
            <a class="button" th:href="@{/diets/new}">+ Crear plan</a>
        </div>

        <section class="card-grid">
            <article th:each="diet : ${diets}" class="panel routine-card">
                <div class="section-heading">
                    <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/><path d="M15 11v11"/><path d="M5 2v4a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V2"/><path d="M8 9v13"/></svg></span>
                    <span class="pill" th:text="${diet.type}">Omnívora</span>
                </div>

                <h2 th:text="${diet.name}">Plan Hipertrofia</h2>
                <p th:text="${diet.goal}">Ganancia muscular</p>
                <small th:text="${diet.description}">Descripción breve del plan nutricional...</small>

                <!-- BOTONERA CON ENLACE DE EDICIÓN INTEGRADO -->
                <div class="card-actions" style="margin-top: auto; padding-top: 1.25rem; display: flex; gap: 0.5rem;">
                    <a th:href="@{'/diets/' + ${diet.id}}" class="button primary" style="flex: 1;">Abrir plan</a>
                    <a th:href="@{'/diets/' + ${diet.id} + '/edit'}" class="button secondary">Editar</a>
                </div>
            </article>
        </section>
    </main>
</div>

</body>
</html>
